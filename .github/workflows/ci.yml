name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compatibility:
    name: Swift 6.0.3 compatibility
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Unit tests
        run: ./build.sh --test

  build:
    name: Build & selftest (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-26-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Verify architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          for BINARY in build/Vorssaint build/com.vorssaint.utils.fan-control build/libVorssaintNowPlaying.dylib; do
            test "$(lipo -archs "$BINARY")" = "$EXPECTED_ARCH"
          done

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Unit tests
        run: ./build.sh --test

      - name: Verify test architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: test "$(lipo -archs build/metrics-tests)" = "$EXPECTED_ARCH"
